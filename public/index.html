<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f7f6">
<link rel="manifest" href="/manifest.webmanifest">
<title>РММ Учёт</title>

<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f5f7f6;color:#202522}
.page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 18px}
.card{width:100%;max-width:430px;background:#fff;border-radius:28px;padding:30px 24px;box-shadow:0 14px 44px rgba(0,0,0,.07)}
.logo{width:62px;height:62px;border-radius:20px;display:flex;align-items:center;justify-content:center;background:#e7f3ec;font-size:29px;margin-bottom:20px}
h1{margin:0;font-size:31px}
.subtitle{margin:7px 0 24px;color:#68706b;font-size:16px}
label{display:block;font-size:14px;font-weight:700;margin:16px 0 7px}
input{width:100%;height:54px;border:1px solid #d8dedb;border-radius:15px;padding:0 15px;font-size:17px;outline:none}
input:focus{border-color:#477b61;box-shadow:0 0 0 3px rgba(71,123,97,.1)}
button{width:100%;height:54px;margin-top:21px;border:0;border-radius:15px;background:#477b61;color:#fff;font-size:17px;font-weight:800}
.msg{display:none;margin-top:16px;padding:12px 14px;border-radius:13px;font-size:14px}
.error{display:block;background:#fff0f0;color:#a03434}
.small{margin-top:20px;text-align:center;color:#8a918d;font-size:12px}
</style>
</head>

<body>
<div class="page">
<div class="card">

<div class="logo">🔧</div>

<h1>РММ Учёт</h1>
<div class="subtitle">Вход в систему</div>

<form id="f">
<label>Логин</label>
<input id="u" autocomplete="username" required>

<label>Пароль</label>
<input id="p" type="password" autocomplete="current-password" required>

<button id="b">Войти</button>
</form>

<div id="m" class="msg"></div>

<div class="small">РММ Учёт • защищённый доступ</div>

</div>
</div>

<script>
const f=document.getElementById('f'),
      m=document.getElementById('m'),
      b=document.getElementById('b');

f.onsubmit=async e=>{
    e.preventDefault();

    m.className='msg';
    b.disabled=true;
    b.textContent='Вход…';

    try{
        const r=await fetch('/api/login',{
            method:'POST',
            credentials:'include',
            headers:{
                'content-type':'application/json'
            },
            body:JSON.stringify({
                username:document.getElementById('u').value.trim(),
                password:document.getElementById('p').value
            })
        });

        let d={};

        try{
            d=await r.json();
        }catch(_){}

        if(r.ok){
            location.href='/app';
            return;
        }

        m.textContent=d.error==='bad_login'
            ? 'Неверный логин или пароль.'
            : 'Ошибка входа: '+(d.error||r.status);

        m.className='msg error';

    }catch(_){
        m.textContent='Нет связи с сервером.';
        m.className='msg error';

    }finally{
        b.disabled=false;
        b.textContent='Войти';
    }
};
</script>

</body>
</html>
