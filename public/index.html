<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f7f6">
  <link rel="manifest" href="/manifest.json">

  <title>РММ Учёт</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7f6;
      color: #202522;
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 18px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 24px;
      padding: 28px 22px;
      box-shadow: 0 12px 40px rgba(0,0,0,.07);
    }

    .logo {
      width: 58px;
      height: 58px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e7f3ec;
      font-size: 27px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
    }

    .subtitle {
      margin: 7px 0 24px;
      color: #68706b;
      font-size: 15px;
    }

    .mode {
      background: #f1f4f2;
      padding: 12px 14px;
      border-radius: 14px;
      margin-bottom: 20px;
      font-size: 14px;
      color: #4f5953;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 650;
      margin: 15px 0 7px;
    }

    input {
      width: 100%;
      height: 52px;
      border: 1px solid #d8dedb;
      border-radius: 14px;
      padding: 0 15px;
      font-size: 16px;
      outline: none;
      background: white;
    }

    input:focus {
      border-color: #477b61;
      box-shadow: 0 0 0 3px rgba(71,123,97,.10);
    }

    button {
      width: 100%;
      height: 52px;
      margin-top: 20px;
      border: 0;
      border-radius: 14px;
      background: #477b61;
      color: white;
      font-size: 16px;
      font-weight: 750;
      cursor: pointer;
    }

    button:disabled {
      opacity: .55;
    }

    .secondary {
      background: #eef2f0;
      color: #344039;
      margin-top: 10px;
    }

    .message {
      display: none;
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 13px;
      font-size: 14px;
      line-height: 1.4;
    }

    .error {
      display: block;
      background: #fff0f0;
      color: #a03434;
    }

    .success {
      display: block;
      background: #edf8f1;
      color: #28633f;
    }

    .small {
      margin-top: 18px;
      text-align: center;
      color: #8a918d;
      font-size: 12px;
    }

    #loginPanel {
      display: none;
    }
  </style>
</head>

<body>

<div class="page">

  <div class="card">

    <div class="logo">🔧</div>

    <h1>РММ Учёт</h1>

    <!-- ПЕРВЫЙ ЗАПУСК -->

    <div id="setupPanel">

      <div class="subtitle">
        Первоначальная настройка системы
      </div>

      <div class="mode">
        Создай главного администратора. Это выполняется только один раз.
      </div>

      <form id="setupForm">

        <label for="setupUsername">Логин администратора</label>

        <input
          id="setupUsername"
          autocomplete="username"
          placeholder="Например: admin"
          required
        >

        <label for="setupPassword">Пароль</label>

        <input
          id="setupPassword"
          type="password"
          autocomplete="new-password"
          placeholder="Минимум 12 символов"
          minlength="12"
          required
        >

        <label for="setupPassword2">Повтори пароль</label>

        <input
          id="setupPassword2"
          type="password"
          autocomplete="new-password"
          placeholder="Повтори пароль"
          minlength="12"
          required
        >

        <button id="setupButton" type="submit">
          Создать администратора
        </button>

      </form>

      <button
        type="button"
        class="secondary"
        onclick="showLogin()"
      >
        Администратор уже создан
      </button>

      <div id="setupMessage" class="message"></div>

    </div>


    <!-- ВХОД -->

    <div id="loginPanel">

      <div class="subtitle">
        Вход в систему
      </div>

      <form id="loginForm">

        <label for="loginUsername">Логин</label>

        <input
          id="loginUsername"
          autocomplete="username"
          placeholder="Логин"
          required
        >

        <label for="loginPassword">Пароль</label>

        <input
          id="loginPassword"
          type="password"
          autocomplete="current-password"
          placeholder="Пароль"
          required
        >

        <button id="loginButton" type="submit">
          Войти
        </button>

      </form>

      <button
        type="button"
        class="secondary"
        onclick="showSetup()"
      >
        Первый запуск
      </button>

      <div id="loginMessage" class="message"></div>

    </div>

    <div class="small">
      РММ Учёт • защищённый доступ
    </div>

  </div>

</div>


<script>

const setupPanel = document.getElementById("setupPanel");
const loginPanel = document.getElementById("loginPanel");

const setupMessage = document.getElementById("setupMessage");
const loginMessage = document.getElementById("loginMessage");


function showLogin() {

  setupPanel.style.display = "none";
  loginPanel.style.display = "block";

  setupMessage.className = "message";
  setupMessage.textContent = "";

}


function showSetup() {

  loginPanel.style.display = "none";
  setupPanel.style.display = "block";

  loginMessage.className = "message";
  loginMessage.textContent = "";

}


function message(element, text, type) {

  element.textContent = text;
  element.className = "message " + type;

}


async function api(path, options = {}) {

  const response = await fetch(path, {
    credentials: "include",
    ...options,
    headers: {
      "Content-Type": "application/json",
      ...(options.headers || {})
    }
  });

  let data = {};

  try {
    data = await response.json();
  } catch (_) {}

  return {
    response,
    data
  };

}


/* =========================
   СОЗДАНИЕ ПЕРВОГО ADMIN
========================= */

document
  .getElementById("setupForm")
  .addEventListener("submit", async function(event) {

    event.preventDefault();

    const username =
      document.getElementById("setupUsername").value.trim();

    const password =
      document.getElementById("setupPassword").value;

    const password2 =
      document.getElementById("setupPassword2").value;

    const button =
      document.getElementById("setupButton");


    if (username.length < 3) {

      message(
        setupMessage,
        "Логин должен содержать минимум 3 символа.",
        "error"
      );

      return;
    }


    if (password.length < 12) {

      message(
        setupMessage,
        "Пароль должен содержать минимум 12 символов.",
        "error"
      );

      return;
    }


    if (password !== password2) {

      message(
        setupMessage,
        "Пароли не совпадают.",
        "error"
      );

      return;
    }


    button.disabled = true;
    button.textContent = "Создание...";


    try {

      const { response, data } =
        await api("/api/setup", {

          method: "POST",

          body: JSON.stringify({
            username,
            password
          })

        });


      if (response.ok) {

        message(
          setupMessage,
          "Администратор создан. Сейчас можно войти.",
          "success"
        );

        document.getElementById("loginUsername").value =
          username;

        setTimeout(() => {

          showLogin();

          document
            .getElementById("loginPassword")
            .focus();

        }, 800);

        return;
      }


      const error =
        data.error ||
        data.message ||
        "";


      if (
        response.status === 409 ||
        error === "setup_done" ||
        error === "already_initialized" ||
        error === "admin_exists"
      ) {

        showLogin();

        message(
          loginMessage,
          "Администратор уже создан. Войди в систему.",
          "success"
        );

        return;
      }


      message(
        setupMessage,
        "Сервер отклонил создание администратора: " +
        (error || ("HTTP " + response.status)),
        "error"
      );


    } catch (error) {

      message(
        setupMessage,
        "Нет связи с сервером.",
        "error"
      );

    } finally {

      button.disabled = false;
      button.textContent =
        "Создать администратора";

    }

  });


/* =========================
   ВХОД
========================= */

document
  .getElementById("loginForm")
  .addEventListener("submit", async function(event) {

    event.preventDefault();

    const username =
      document.getElementById("loginUsername").value.trim();

    const password =
      document.getElementById("loginPassword").value;

    const button =
      document.getElementById("loginButton");


    button.disabled = true;
    button.textContent = "Вход...";


    try {

      const { response, data } =
        await api("/api/login", {

          method: "POST",

          body: JSON.stringify({
            username,
            password
          })

        });


      if (response.ok) {

        message(
          loginMessage,
          "Вход выполнен.",
          "success"
        );


        /*
          После входа пробуем перейти
          в основное приложение.
        */

        const destination =
          data.redirect ||
          data.url ||
          "/app";


        window.location.href = destination;

        return;
      }


      message(
        loginMessage,
        data.error ||
        data.message ||
        "Неверный логин или пароль.",
        "error"
      );


    } catch (error) {

      message(
        loginMessage,
        "Нет связи с сервером.",
        "error"
      );

    } finally {

      button.disabled = false;
      button.textContent = "Войти";

    }

  });

</script>

</body>
</html>
